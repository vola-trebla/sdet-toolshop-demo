name: Playwright Tests (manual)

# E2E/API suite is NOT a PR gate. It runs against a live third-party site, so it
# is triggered on demand from the Actions tab (Run workflow), not on every push/PR.
on:
  workflow_dispatch:
    inputs:
      project:
        description: 'Which suite to run'
        type: choice
        options: [all, web, api]
        default: all
      grep:
        description: 'Optional tag/title filter (e.g. @smoke)'
        type: string
        default: ''

jobs:
  test:
    name: Shard ${{ matrix.shard }}/2
    runs-on: ubuntu-latest
    # Official Playwright image ships browsers + system deps preinstalled.
    # Pin the tag to the @playwright/test version in package.json to avoid drift.
    container:
      image: mcr.microsoft.com/playwright:v1.60.0-noble
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      # No "playwright install" step — the container already has the browsers.
      - name: Run tests (sharded)
        run: |
          ARGS="--shard=${{ matrix.shard }}/2"
          if [ "${{ inputs.project }}" != "all" ]; then ARGS="$ARGS --project=${{ inputs.project }}"; fi
          if [ -n "${{ inputs.grep }}" ]; then ARGS="$ARGS --grep ${{ inputs.grep }}"; fi
          npx playwright test $ARGS

      - name: Upload blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-${{ matrix.shard }}
          path: blob-report
          retention-days: 7

  merge-reports:
    name: Merge reports
    if: ${{ !cancelled() }}
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - name: Download blob reports
        uses: actions/download-artifact@v4
        with:
          path: all-blob-reports
          pattern: blob-report-*
          merge-multiple: true
      - name: Merge into HTML report
        run: npx playwright merge-reports --reporter html ./all-blob-reports
      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        with:
          name: html-report
          path: playwright-report
          retention-days: 14
