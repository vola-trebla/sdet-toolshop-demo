name: Playwright Tests (manual)

# E2E/API suite is NOT a PR gate. It runs against a live third-party site, so it
# is triggered on demand from the Actions tab (Run workflow), not on every push/PR.
on:
  workflow_dispatch:
    inputs:
      project:
        description: 'Which suite to run'
        type: choice
        options: [all, web-public, web-auth, api]
        default: all
      grep:
        description: 'Optional tag/title filter (e.g. @smoke)'
        type: string
        default: ''

jobs:
  test:
    name: Shard ${{ matrix.shard }}/2
    runs-on: ubuntu-latest
    # Official Playwright image ships browsers + system deps preinstalled.
    # Pin the tag to the @playwright/test version in package.json to avoid drift.
    container:
      image: mcr.microsoft.com/playwright:v1.60.0-noble
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    # Config requires these to be set explicitly on CI (no implicit fallback). We pass
    # them here defaulting to the public Toolshop demo; override via repo variables /
    # secrets to point at another environment.
    env:
      WEB_BASE_URL: ${{ vars.WEB_BASE_URL || 'https://practicesoftwaretesting.com' }}
      API_BASE_URL: ${{ vars.API_BASE_URL || 'https://api.practicesoftwaretesting.com' }}
      CUSTOMER_EMAIL: ${{ vars.CUSTOMER_EMAIL || 'customer@practicesoftwaretesting.com' }}
      CUSTOMER_PASSWORD: ${{ secrets.CUSTOMER_PASSWORD || 'welcome01' }}
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: npm ci

      # No "playwright install" step — the container already has the browsers.
      - name: Run tests (sharded)
        shell: bash
        run: |
          ARGS=(--shard="${{ matrix.shard }}/2")
          if [ "${{ inputs.project }}" != "all" ]; then ARGS+=(--project="${{ inputs.project }}"); fi
          if [ -n "${{ inputs.grep }}" ]; then ARGS+=(--grep "${{ inputs.grep }}"); fi
          npx playwright test "${ARGS[@]}"

      - name: Upload blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: blob-report-${{ matrix.shard }}
          path: blob-report
          retention-days: 7

  merge-reports:
    name: Merge reports
    if: ${{ !cancelled() }}
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - name: Download blob reports
        uses: actions/download-artifact@v8
        with:
          path: all-blob-reports
          pattern: blob-report-*
          merge-multiple: true
      - name: Merge into HTML report
        run: npx playwright merge-reports --reporter html ./all-blob-reports
      - name: Upload HTML report
        uses: actions/upload-artifact@v7
        with:
          name: html-report
          path: playwright-report
          retention-days: 14
