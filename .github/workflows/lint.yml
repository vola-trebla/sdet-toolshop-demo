name: Static checks

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  check:
    name: Lint + typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      # ESLint + tsc --noEmit. Fails the job on any lint error or type error.
      - name: Run static checks
        run: npm run check
